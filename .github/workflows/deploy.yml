# Reusable deploy workflow — called by ci.yml (deploy-dev) and cd.yml (deploy-prod)
#
# This workflow handles the actual CDK deployment to a given environment.
# It is not triggered directly — always called via workflow_call.
#
# Usage from ci.yml / cd.yml:
#   uses: ./.github/workflows/deploy.yml
#   with:
#     environment: dev
#     stack-name: AppStack-dev
#   secrets:
#     aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: dev or prod"
        required: true
        type: string
      stack-name:
        description: "CDK stack name to deploy (e.g. AppStack-dev)"
        required: true
        type: string
      aws-region:
        description: "AWS region to deploy to"
        required: false
        type: string
        default: "us-east-1"
    secrets:
      aws-role-arn:
        description: "IAM role ARN to assume via OIDC (GitHubActionsDeployRole)"
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.stack-name }}
    # CodeBuild runner label format — required by AWS CodeBuild GitHub Actions runner (BR-PIPE-08, S-13)
    runs-on: codebuild-flask-lambda-api-runner-${{ github.run_id }}-${{ github.run_attempt }}

    # OIDC permissions — minimum required (BR-PIPE-06, SECURITY-12)
    permissions:
      id-token: write  # Allows requesting OIDC JWT token
      contents: read   # Allows checkout

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install app dev dependencies
        # Install app requirements so CDK asset bundling can verify them
        run: pip install -r app/requirements-dev.txt

      - name: Install infra dependencies
        # Use npm ci (not npm install) — uses package-lock.json exactly (BR-PIPE-05, SECURITY-10)
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials via OIDC
        # No stored access keys — short-lived credentials via OIDC (BR-PIPE-01, SECURITY-12)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: GitHubActions-${{ inputs.environment }}-${{ github.run_id }}

      - name: Deploy CDK stack
        # --require-approval never — CI/CD should not prompt for manual approval
        # --context envName passes the environment to AppStack._resolveConfig()
        working-directory: infra
        run: |
          npx cdk deploy ${{ inputs.stack-name }} \
            --context envName=${{ inputs.environment }} \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Show stack outputs
        # Display API URL and Lambda ARN for visibility in the pipeline log
        working-directory: infra
        if: success()
        run: |
          echo "=== CDK Stack Outputs ==="
          cat cdk-outputs.json
