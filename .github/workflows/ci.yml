# CI Workflow — triggered on Pull Request to the `dev` branch
#
# Runs quality gates (lint, unit tests, IaC validation) then deploys to dev.
# Deploy only runs if all quality gates pass (BR-PIPE-03).
#
# Branch strategy:
#   feature/* → PR to dev → this workflow runs
#   dev → PR/merge to main → cd.yml runs

name: CI

on:
  pull_request:
    branches:
      - dev  # Triggers only on PRs targeting the dev branch (FR-04)
    paths-ignore:
      - "README.md"
      - "aidlc-docs/**"
      - "*.md"

# OIDC permissions — applied at workflow level, inherited by all jobs (BR-PIPE-06)
permissions:
  id-token: write  # Required for OIDC token request
  contents: read   # Required for checkout

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Quality gates — lint, unit tests, IaC validation
  # ---------------------------------------------------------------------------
  test:
    name: Lint, Test & Synth
    # CodeBuild runner — uses CodeBuild project as compute (S-13, BR-PIPE-08)
    runs-on: codebuild-flask-lambda-api-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install app dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint — flake8
        run: flake8 app/ --max-line-length=100 --exclude=app/tests,app/.venv

      - name: Unit tests — pytest
        run: pytest app/tests/ -v --tb=short

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci  # Exact versions from package-lock.json (BR-PIPE-05)

      - name: Validate IaC — cdk synth
        # Synthesises the CDK app to CloudFormation — catches TypeScript/construct errors
        # Does NOT make any AWS API calls (safe to run without AWS credentials)
        working-directory: infra
        run: npx cdk synth AppStack-dev --context envName=dev

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to dev — only runs if all test steps pass (BR-PIPE-03)
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to dev
    needs: test  # Blocks deploy if lint/tests/synth fail (BR-PIPE-03, S-10)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      stack-name: AppStack-dev
      aws-region: us-east-1
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
